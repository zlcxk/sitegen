version: "1.0.0"
profiles:
  - id: blackbox
    name: Blackbox 站点探测
    target: domain
    scope: domain
    auto: true
    panels:
      - id: blackbox-availability
        name: 站点可用性
        description: Blackbox 探测成功率（最近 5 分钟平均值）。
        query: |
          avg_over_time(probe_success{%SELECTOR%}[5m])
        unit: percentunit
        panel: stat
        sections: [overview]
        instant: true
        thresholds:
          - color: red
          - color: green
            value: 0.99
        requiredMetrics:
          - probe_success
        requiredLabels: [job, instance]

      - id: blackbox-duration
        name: 外部探测耗时
        description: Blackbox 探测总耗时，来自 probe_duration_seconds。
        query: |
          avg(probe_duration_seconds{%SELECTOR%})
        unit: s
        panel: timeseries
        legendFormat: "{{instance}}"
        sections: [overview]
        requiredMetrics:
          - probe_duration_seconds
        requiredLabels: [job, instance]
