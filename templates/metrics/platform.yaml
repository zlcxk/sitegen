version: "1.0.0"
profiles:
  - id: platform
    name: 平台健康
    target: application
    scope: job
    auto: true
    discovery:
      metric: up
      groupBy: [job]
    panels:
      - id: app-up
        name: 应用指标采集状态
        description: 使用 up 指标按 Prometheus job 展示站点关联应用的采集状态。up=1 仅表示 Prometheus 成功抓取目标，不代表应用业务健康。
        query: |
          min by (job) (up{%SELECTOR%})
        unit: none
        panel: stat
        sections: [overview]
        instant: true
        thresholds:
          - color: red
          - color: green
            value: 1
        requiredMetrics:
          - up
        requiredLabels: [job]
