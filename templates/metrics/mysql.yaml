version: "1.0.0"
profiles:
  - id: mysql-basic
    name: MySQL 基础状态
    target: component
    scope: component
    componentTypes: [mysql]
    panels:
      - id: mysql-up
        name: MySQL 连接状态
        description: mysql_up=1 表示 exporter 对 MySQL 的连接检查成功，不代表 SQL 性能或业务健康；连接数、慢查询等指标需在目标 Prometheus 确认后再加入模板。
        query: |
          max(mysql_up{%SELECTOR%})
        unit: none
        panel: stat
        sections: [overview]
        instant: true
        thresholds:
          - color: red
          - color: green
            value: 1
        requiredMetrics:
          - mysql_up
        requiredLabels: [job, instance]
