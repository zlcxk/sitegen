version: "1.0.0"
profiles:
  - id: kubernetes
    name: Kubernetes Workload
    target: application
    scope: namespace
    panels:
      - id: pod-cpu
        name: Pod CPU
        description: container_cpu_usage_seconds_total 按 Pod 聚合；排除 container 为空和 POD 基础容器序列。
        query: |
          sum by (pod) (
            rate(container_cpu_usage_seconds_total{%SELECTOR%, container!="", container!="POD"}[5m])
          )
        unit: none
        panel: timeseries
        legendFormat: "{{pod}}"
        sections: [runtime, environment]
        requiredMetrics:
          - container_cpu_usage_seconds_total
        requiredLabels: [namespace, pod, container]

      - id: pod-memory
        name: Pod 内存 Working Set
        description: container_memory_working_set_bytes 按 Pod 聚合；排除基础容器，不能与 JVM Heap 混为一谈。
        query: |
          sum by (pod) (
            container_memory_working_set_bytes{%SELECTOR%, container!="", container!="POD"}
          )
        unit: bytes
        panel: timeseries
        legendFormat: "{{pod}}"
        sections: [runtime, environment]
        requiredMetrics:
          - container_memory_working_set_bytes
        requiredLabels: [namespace, pod, container]

      - id: cpu-throttling
        name: CPU Throttling
        description: 被限流的 CFS 周期占比。使用 cAdvisor 标准指标，需通过 sitegen check 在目标 Prometheus 确认。
        query: |
          sum by (pod) (
            rate(container_cpu_cfs_throttled_periods_total{%SELECTOR%, container!="", container!="POD"}[5m])
          )
          /
          clamp_min(
            sum by (pod) (
              rate(container_cpu_cfs_periods_total{%SELECTOR%, container!="", container!="POD"}[5m])
            ),
            1e-9
          )
        unit: percentunit
        panel: timeseries
        legendFormat: "{{pod}}"
        sections: [runtime, environment]
        thresholds:
          - color: green
          - color: yellow
            value: 0.1
          - color: red
            value: 0.25
        requiredMetrics:
          - container_cpu_cfs_throttled_periods_total
          - container_cpu_cfs_periods_total
        requiredLabels: [namespace, pod, container]

      - id: pod-status
        name: Pod 状态
        description: kube_pod_status_phase = 1 的 Pod 数量，按 phase 分类。需要 kube-state-metrics。
        query: |
          sum by (pod, phase) (
            kube_pod_status_phase{%SELECTOR%} == 1
          )
        unit: none
        panel: table
        sections: [environment]
        instant: true
        requiredMetrics:
          - kube_pod_status_phase
        requiredLabels: [namespace, pod, phase]

      - id: pod-node-distribution
        name: Pod Node 分布
        description: 当前筛选 Pod 按 node 的数量分布，来自 kube_pod_info。
        query: |
          count by (node) (
            kube_pod_info{%SELECTOR%}
          )
        unit: short
        panel: table
        sections: [environment]
        instant: true
        requiredMetrics:
          - kube_pod_info
        requiredLabels: [namespace, pod, node]
