apiVersion: site-observability/v1
kind: Site

metadata:
  id: admin-dev
  name: 管理后台站点
  environment: dev
  description: 根据目标 Prometheus 的真实数据验证过的站点配置

spec:
  domains:
    - id: admin
      url: https://admin-dev.rtdgo.tech
      blackbox:
        job: blackbox-sites-dev
        instance: https://admin-dev.rtdgo.tech
      entryApplications:
        - rtd-admin-dev

  applications:
    - id: rtd-admin-dev
      application: rtd-admin
      namespace: dev

      prometheus:
        job: rtd-admin
        labels:
          application: rtd-admin
          namespace: dev

      skywalking:
        enabled: true
        service: rtd-admin_dev
        endpointFormat: "{method}:{uri}"

      metrics:
        - http
        - jvm
        - kubernetes

      kubernetes:
        # 目标 Prometheus 中没有 kube_pod_labels（kube-state-metrics 未暴露），
        # 因此使用经过真实 cAdvisor 数据验证的 Pod 名称正则。
        podSelector:
          mode: pod-regex
          pod: "^rtd-admin-.*$"
        # 已用真实数据核对：Pod 父级 cgroup 与 pause 容器都没有 container 标签，
        # 业务容器为 container="main"。container != "" 只保留业务容器。
        containerMatchers:
          - name: container
            operator: not_equal
            value: ""

      dependencies:
        - user-center-application-dev
        - mysql-dev
        - redis-dev

    - id: user-center-application-dev
      application: user-center-application
      namespace: dev

      prometheus:
        job: user-center-application
        labels:
          application: user-center-application
          namespace: dev

      skywalking:
        enabled: true
        service: user-center-application_dev
        endpointFormat: "{method}:{uri}"

      # 该应用在当前 Prometheus 中没有 HTTP RED 指标，因此不启用 http，
      # 避免生成永远无数据的 HTTP 面板。
      metrics:
        - jvm
        - kubernetes

      kubernetes:
        podSelector:
          mode: pod-regex
          pod: "^user-center-application-.*$"
        containerMatchers:
          - name: container
            operator: not_equal
            value: ""

      dependencies:
        - mysql-dev
        - redis-dev

  components:
    - id: mysql-dev
      name: MySQL Dev
      type: mysql
      prometheus:
        job: scrapeConfig/monitoring/mysql-exporter-dev
        instance: "10.10.100.10:3306"
      metrics:
        - mysql-basic

    - id: redis-dev
      name: Redis Dev
      type: redis
      prometheus:
        job: scrapeConfig/monitoring/redis-exporter
        instance: "redis://10.10.100.10:16379"
      metrics:
        - redis-basic

  links:
    grafana: "https://grafana-dev.rtdgo.tech"
    # 目标 Grafana 中的 SkyWalking 实例 / Endpoint / Trace / Service Dashboard。
    # 使用相对路径，生成器会统一编码参数；不要在其他模板中硬编码 UID。
    skywalkingServiceDashboard: "d/ffhv7bsxmi48wd/skywalking-service"
    skywalkingInstanceDashboard: "d/efigjuk3p9a0wc/skywalking-instance"
    skywalkingEndpointDashboard: "d/bfigjdt9vx98ga/skywalking-endpoint"
    skywalkingTraceDashboard: "d/ad2xd6l/eksen-skywalking-trace"

    # 依赖组件专业 Dashboard。组件状态面板会带上对应实例参数。
    componentDashboards:
      mysql: "0D6dTg3Zk"
      redis: "redis-exporter-overview"
    componentDashboardParams:
      mysql:
        var-host: "{instance}"
        var-node_host: "{host}"
      redis:
        var-instance: "{instance}"

    # 额外专业 Dashboard 导航；不复制其面板，只提供下钻。
    dashboards:
      - title: "Kubernetes 集群"
        url: "d/StarsL_cn_K8S/k8s-dashboard?var-NameSpace=dev"
      - title: "Blackbox Prober"
        url: "d/NEzutrbMk/blackbox-exporter-http-prober?var-job=blackbox-sites-dev&var-instance=https%3A%2F%2Fadmin-dev.rtdgo.tech"
      - title: "MySQL Dev"
        url: "d/0D6dTg3Zk/mysqld-exporter-dashboard?var-host=10.10.100.10%3A3306&var-node_host=10.10.100.10"
      - title: "Redis Dev"
        url: "d/redis-exporter-overview/redis?var-instance=redis%3A%2F%2F10.10.100.10%3A16379"
